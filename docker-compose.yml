services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置数据库密码}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [erp-internal]
  api:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-erp}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-erp}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置会话密钥}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置管理员密码}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Budapest}
    depends_on:
      db: { condition: service_healthy }
    networks: [erp-internal]
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on: [api]
    networks: [erp-internal]
volumes:
  postgres_data:
networks:
  erp-internal:
    driver: bridge
