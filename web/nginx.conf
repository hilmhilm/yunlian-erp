server {
  listen 80;
  server_name _;
  client_max_body_size 5m;
  root /usr/share/nginx/html;
  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://api:3000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /uploads/ { proxy_pass http://api:3000/uploads/; proxy_set_header Host $host; }
}
